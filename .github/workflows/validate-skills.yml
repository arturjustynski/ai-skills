name: Validate skills

on:
  push:
    paths:
      - "skills/**"
      - "evals/**"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "evals/**"
      - ".github/workflows/validate-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate skills and regression fixtures
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys
          import yaml

          skills_root = Path("skills")
          evals_root = Path("evals")
          errors = []

          if not skills_root.is_dir():
              errors.append("Missing skills/ directory")
          else:
              skill_dirs = sorted(path for path in skills_root.iterdir() if path.is_dir())
              if not skill_dirs:
                  errors.append("No skill directories found under skills/")

              for skill_dir in skill_dirs:
                  skill_file = skill_dir / "SKILL.md"
                  if not skill_file.is_file():
                      errors.append(f"{skill_dir}: missing SKILL.md")
                      continue

                  text = skill_file.read_text(encoding="utf-8")
                  lines = text.splitlines()

                  if len(lines) > 500:
                      print(
                          f"::warning file={skill_file}::SKILL.md has {len(lines)} lines; "
                          "consider progressive disclosure."
                      )

                  if not lines or lines[0].strip() != "---":
                      errors.append(f"{skill_file}: YAML frontmatter must start with ---")
                      continue

                  try:
                      closing = next(
                          i for i, line in enumerate(lines[1:], start=1)
                          if line.strip() == "---"
                      )
                  except StopIteration:
                      errors.append(f"{skill_file}: YAML frontmatter has no closing ---")
                      continue

                  try:
                      metadata = yaml.safe_load("\n".join(lines[1:closing])) or {}
                  except yaml.YAMLError as exc:
                      errors.append(f"{skill_file}: invalid YAML frontmatter: {exc}")
                      continue

                  if not isinstance(metadata, dict):
                      errors.append(f"{skill_file}: frontmatter must be a YAML mapping")
                      continue

                  name = metadata.get("name")
                  description = metadata.get("description")

                  if not isinstance(name, str) or not name:
                      errors.append(f"{skill_file}: name is required")
                  else:
                      if len(name) > 64:
                          errors.append(f"{skill_file}: name exceeds 64 characters")
                      if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", name):
                          errors.append(f"{skill_file}: invalid name {name!r}")
                      if name != skill_dir.name:
                          errors.append(
                              f"{skill_file}: frontmatter name {name!r} does not match "
                              f"directory {skill_dir.name!r}"
                          )

                  if not isinstance(description, str) or not description.strip():
                      errors.append(f"{skill_file}: description is required")
                  elif len(description) > 1024:
                      errors.append(f"{skill_file}: description exceeds 1024 characters")

                  # Local Markdown resources must stay inside the skill directory
                  # and resolve to real files.
                  for raw_target in re.findall(r"\[[^\]]+\]\(([^)]+)\)", text):
                      target = raw_target.strip().split("#", 1)[0]
                      if not target or "://" in target or target.startswith(("mailto:", "/")):
                          continue

                      local_target = (skill_dir / target).resolve()
                      try:
                          local_target.relative_to(skill_dir.resolve())
                      except ValueError:
                          errors.append(
                              f"{skill_file}: reference escapes skill directory: {raw_target}"
                          )
                          continue

                      if not local_target.exists():
                          errors.append(
                              f"{skill_file}: missing referenced resource: {raw_target}"
                          )

          if evals_root.exists():
              eval_dirs = sorted(path for path in evals_root.iterdir() if path.is_dir())
              for eval_dir in eval_dirs:
                  cases_file = eval_dir / "cases.yaml"
                  if not cases_file.is_file():
                      errors.append(f"{eval_dir}: missing cases.yaml")
                      continue

                  try:
                      suite = yaml.safe_load(cases_file.read_text(encoding="utf-8")) or {}
                  except yaml.YAMLError as exc:
                      errors.append(f"{cases_file}: invalid YAML: {exc}")
                      continue

                  cases = suite.get("cases") if isinstance(suite, dict) else None
                  if not isinstance(cases, list) or not cases:
                      errors.append(f"{cases_file}: cases must be a non-empty list")
                      continue

                  seen_ids = set()
                  for index, case in enumerate(cases, start=1):
                      prefix = f"{cases_file}: case #{index}"
                      if not isinstance(case, dict):
                          errors.append(f"{prefix} must be a mapping")
                          continue

                      case_id = case.get("id")
                      if not isinstance(case_id, str) or not re.fullmatch(
                          r"[a-z0-9]+(?:-[a-z0-9]+)*", case_id
                      ):
                          errors.append(f"{prefix} has invalid id {case_id!r}")
                      elif case_id in seen_ids:
                          errors.append(f"{cases_file}: duplicate case id {case_id!r}")
                      else:
                          seen_ids.add(case_id)

                      status = case.get("status", "baseline")
                      if status not in {"baseline", "target"}:
                          errors.append(
                              f"{prefix} has invalid status {status!r}; "
                              "expected 'baseline' or 'target'"
                          )

                      prompt = case.get("prompt")
                      if not isinstance(prompt, str) or not prompt.strip():
                          errors.append(f"{prefix} requires a non-empty prompt")

                      for field in ("must", "must_not"):
                          values = case.get(field)
                          if not isinstance(values, list) or not values:
                              errors.append(f"{prefix} requires a non-empty {field} list")
                          elif not all(
                              isinstance(value, str) and value.strip()
                              for value in values
                          ):
                              errors.append(
                                  f"{prefix} {field} entries must be non-empty strings"
                              )

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          print("All skills and regression fixtures passed structural validation.")
